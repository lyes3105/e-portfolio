<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Devine le nombre - Version Finale</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .game-box {
            border: 1px solid #333;
            padding: 30px;
            width: 500px;
            min-height: 400px;
        }

        .input-area {
            margin: 20px 0;
        }

        #resultat {
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <div class="game-box">
        <h1>Devine le nombre !</h1>
        <p>Le but du jeu est de choisir un nombre entre 1 et 100 et de trouver le nombre
            secret.</p>
        <div class="input-area">
            Choisir un nombre entre 1 et 100 :
            <input type="number" id="userGuess" style="width: 40px;">
            <button onclick="verifier()">Jouer</button>
        </div>
        <div id="resultat">Résultat : --</div>
        <div style="margin-top:20px;">
            <strong>Historique des tentatives :</strong>
            <ul id="historique"></ul>
        </div>
    </div>
    <script>
        // Génération du nombre secret entre 1 et 100
        const secret = Math.floor(Math.random() * 100) + 1;
        function verifier() {
            const input = document.getElementById('userGuess');
            const tentative = parseInt(input.value);
            const resDiv = document.getElementById('resultat');
            const histUl = document.getElementById('historique');
            if (!tentative || tentative < 1 || tentative > 100) return;
            let feedback = "";
            if (tentative < secret) {
                feedback = tentative + " trop petit";
            } else if (tentative > secret) {
                feedback = tentative + " trop grand";
            } else {
                feedback = "BRAVO ! " + tentative + " est le nombre secret !";
            }
            // Affichage immédiat
            resDiv.innerText = "Résultat : " + feedback;
            // Ajout à la liste d'historique
            let li = document.createElement('li');
            li.appendChild(document.createTextNode(feedback));
            histUl.appendChild(li);
            input.value = ""; // Vide le champ
        }
    </script>
</body>

</html>
